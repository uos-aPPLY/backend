spring:
  profiles:
    active: local # local or docker
  jackson:
    serialization:
      fail-on-empty-beans: false

  # 공통 Datasource 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # 공통 JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB

  mvc:
    async:
      request-timeout: 60000

  # 공통 Cloud 설정
  cloud:
    aws:
      region:
        static: ap-northeast-2
      s3:
        bucket: diarypic-bucket
#      credentials:
#        access-key: ${AWS_ACCESS_KEY_ID}
#        secret-key: ${AWS_SECRET_ACCESS_KEY}

  # 공통 Security 설정
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            authorization-grant-type: authorization_code
            scope:
              - profile
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

apple:
  auth:
    client-id: com.apply.diarypic
    issuer: https://appleid.apple.com
    jwk-set-uri: https://appleid.apple.com/auth/keys

google:
  maps:
    api:
      key: ${GOOGLE_MAPS_API_KEY}

springdoc:
  override-with-generic-response: false
  server:
    - url: https://diarypic.com
      description: Diarypic API Server

# 공통 JWT 설정
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 7200000
  refresh-secret: ${JWT_REFRESH_SECRET}
  refresh-expiration-ms: 2678400000

# 공통 서버 설정
server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: NATIVE


# 공통 로깅 설정
logging:
  level:
    root: INFO # 애플리케이션 전체의 기본 로그 레벨

    # 스프링 프레임워크 관련 로그 레벨
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN

    com.apply.diarypic.global.security.jwt: WARN
    com.apply.diarypic.global.security.jwt.JwtAuthenticationFilter: WARN

    com.apply.diarypic.terms.service.TermsService: WARN
    # c.a.diarypic: WARN
    # c.a.diarypic.terms.service.TermsService: WARN

# spring:
#  jpa:
#    show-sql: false # 이것도 방법이지만, 위 로거 설정이 더 세밀함

# baseUrl 설정
base-url: ${BASE_URL:http://localhost:8080}

